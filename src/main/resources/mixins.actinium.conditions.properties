# Late/conditional mixin configs and the mod ids that gate them.
# Format: <config name>=<mod ids>
# Comma-separated ids form an AND group; '|' separates alternative groups.
# A config loads when ANY group is fully present.
# Kept separate from the mixin json files: the mixin loader does not accept custom fields.
mixins.actinium.dh.json=distanthorizons
mixins.actinium.gibbed.json=gibbed
mixins.actinium.ichunutil.json=ichunutil
mixins.actinium.lumenized.json=lumenized|gregtech
mixins.actinium.revoui.json=neofontrender_ui_enhancements
mixins.actinium.betterfoliage.json=betterfoliage
mixins.actinium.ccl.json=codechickenlib
mixins.actinium.voxelmap.json=voxelmap
mixins.actinium.extrautils2.json=extrautils2
mixins.actinium.cofhcore.json=cofhcore
mixins.actinium.oldresearch.json=oldresearch
mixins.actinium.botania.json=botania
mixins.actinium.hbm.json=hbm
mixins.actinium.scannable.json=scannable
